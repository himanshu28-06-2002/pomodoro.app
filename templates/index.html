<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>🍅 Pomodoro Timer</h1>
    <p>Work smarter with 25-minute focused sessions.</p>

    <!-- ⏱️ Timer Display & Buttons -->
    <div style="text-align:center; margin-top: 30px;">
        <h2 id="timer">25:00</h2>
        <button onclick="startTimer()">▶️ Start</button>
        <button onclick="pauseTimer()">⏸️ Pause</button>
        <button onclick="resetTimer()">🔁 Reset</button>
    </div>

    <!-- 🔔 Sound Alert Audio -->
    <audio id="alarmSound">
        <source src="/static/sound/ding.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- 🧠 Timer Script -->
    <script>
        let timer;
        let totalTime = 25 * 60; // 25 minutes
        let remainingTime = totalTime;
        let isRunning = false;

        function updateDisplay() {
            let minutes = Math.floor(remainingTime / 60);
            let seconds = remainingTime % 60;
            document.getElementById('timer').textContent =
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timer = setInterval(() => {
                if (remainingTime > 0) {
                    remainingTime--;
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    document.getElementById("alarmSound").play();  // 🔔 Sound bajao
                    alert("⏰ Time's up! Take a break.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timer);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            remainingTime = totalTime;
            updateDisplay();
        }

        // Page load pe timer dikhana
        updateDisplay();
    </script>
</body>
</html>
