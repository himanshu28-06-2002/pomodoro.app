<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Timer - Test Mode</title> <!-- ⬅️ Title Changed -->
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: #f9f9f9; /* ⬅️ Light background for test */
            font-family: Arial, sans-serif;
        }
        .testing-banner {
            background: #ffcc00;
            color: #000;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ⬅️ Testing Banner -->
    <div class="testing-banner">🔧 TESTING MODE ACTIVE 🔧</div>

    <h1>🍅 Pomodoro Timer</h1>
    <p>Work smarter with 25-minute focused sessions.</p>

    <!-- Timer Display & Controls -->
    <div>
        <h2 id="timer">25:00</h2>

        <button onclick="startTimer()">▶️ Start</button>
        <button onclick="pauseTimer()">⏸️ Pause</button>
        <button onclick="resetTimer()">🔁 Reset</button>

        <!-- ⬅️ New Test Button -->
        <button onclick="fastForward()">⏩ Skip to End</button>
    </div>

    <!-- Completed Sessions Info -->
    <div class="completed-info">
        ✅ You have completed <strong>{{ completed }}</strong> Pomodoro session(s) today!
    </div>

    <!-- View History Link -->
    <p style="margin-top: 20px;">
        <a href="/history" style="text-decoration: none; color: #d64545; font-weight: bold;">
            🔍 View History
        </a>
    </p>

    <!-- Sound Alert -->
    <audio id="alarmSound">
        <source src="/static/sound/ding.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Timer Script -->
    <script>
        let timer;
        let totalTime = 25 * 60;
        let remainingTime = totalTime;
        let isRunning = false;

        function updateDisplay() {
            let minutes = Math.floor(remainingTime / 60);
            let seconds = remainingTime % 60;
            document.getElementById('timer').textContent =
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timer = setInterval(() => {
                if (remainingTime > 0) {
                    remainingTime--;
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    document.getElementById("alarmSound").play();
                    alert("⏰ Time's up! Take a break.");
                    window.location.href = "/complete";  // record to DB
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timer);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            remainingTime = totalTime;
            updateDisplay();
        }

        // ⬅️ Test Feature: Skip to End
        function fastForward() {
            remainingTime = 1;  // only 1 second left
            updateDisplay();
        }

        updateDisplay();
    </script>

</body>
</html>
